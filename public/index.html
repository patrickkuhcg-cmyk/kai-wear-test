<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>MyPA</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto;background:#f5f7fb;color:#13213c}.app{max-width:430px;margin:auto;min-height:100vh;background:#fff}.top{padding:16px;border-bottom:1px solid #e7eaf0;position:sticky;top:0;background:#fff}.brand{font-size:25px;font-weight:800}.sub{font-size:12px;color:#6b7280}.content{padding:16px 16px 110px}.hero{background:linear-gradient(135deg,#173b99,#2862ff);color:#fff;border-radius:20px;padding:18px;margin:12px 0 20px}.hero b{font-size:26px}.muted{color:#dbe5ff;font-size:13px;margin-top:4px}.section{margin:20px 0}.section h3{font-size:14px}.card{border:1px solid #e4e7ed;border-radius:16px;padding:14px;margin:10px 0}.row{display:flex;gap:12px}.avatar{width:42px;height:42px;border-radius:50%;background:#eaf0ff;color:#2862ff;display:grid;place-items:center;font-weight:800}.title{font-weight:800}.meta{font-size:12px;color:#6b7280;margin-top:3px}.body{font-size:14px;line-height:1.45;margin-top:8px}.suggest{background:#f7f9fd;padding:10px;border-radius:10px;margin-top:10px}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700}.primary{background:#2862ff;color:#fff}.secondary{background:#eef1f5}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);padding:10px;background:#fff;border-top:1px solid #e7eaf0}.compose{display:flex;gap:8px}.compose input,input{flex:1;padding:12px;border:1px solid #dfe3ea;border-radius:12px;font:inherit}.login{padding:28px}.hidden{display:none}.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#17233f;color:#fff;padding:10px 14px;border-radius:10px;display:none}</style></head><body><div class='app'><div id='login' class='login'><div class='brand'>MyPA</div><div class='sub'>Your Personal Communications Assistant</div><h2>Owner access</h2><input id='pin' type='password' inputmode='numeric' placeholder='Enter PIN'><div class='actions'><button class='btn primary' onclick='login()'>Open MyPA</button></div><p class='meta'>Private test version for the MedRelief owner.</p></div><div id='main' class='hidden'><div class='top'><div class='brand'>MyPA</div><div class='sub'>Your Personal Communications Assistant</div></div><div class='content'><h2 id='hello'>Good morning</h2><p class='meta'>I’ll bring you only what needs your attention.</p><div class='hero'><b id='count'>Checking…</b><div class='muted' id='summary'>Reviewing conversations.</div></div><div class='section'><h3>Needs you</h3><div id='needs'></div></div><div class='section'><h3>MyPA handled</h3><div id='activity'></div></div><div class='section'><h3>Test incoming WhatsApp</h3><div class='card'><input id='testName' value='Sarah' placeholder='Contact name'><div style='height:8px'></div><input id='testText' value='Can I meet Patrick tomorrow afternoon?' placeholder='Incoming message'><div class='actions'><button class='btn secondary' onclick='simulate()'>Simulate message</button></div></div></div></div><div class='composer'><div class='compose'><input id='ask' placeholder='Tell MyPA…'><button class='btn primary' onclick='ask()'>Send</button></div></div></div></div><div id='toast' class='toast'></div><script>function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:document.getElementById('pin').value})});if(!r.ok)return toast('Wrong PIN');document.getElementById('login').classList.add('hidden');document.getElementById('main').classList.remove('hidden');load()}async function api(url,opt){let r=await fetch(url,opt);if(r.status===401){document.getElementById('main').classList.add('hidden');document.getElementById('login').classList.remove('hidden');throw Error('Login required')}return r}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function load(){try{let r=await api('/api/home');let d=await r.json();document.getElementById('count').textContent=`${d.needs.length} ${d.needs.length===1?'thing needs':'things need'} you`;document.getElementById('summary').textContent=d.needs.length?'I’ve prepared the next step for each one.':'Nothing needs your attention right now.';document.getElementById('needs').innerHTML=d.needs.length?d.needs.map(i=>`<div class='card'><div class='row'><div class='avatar'>${esc((i.contact_name||'?')[0])}</div><div style='flex:1'><div class='title'>${esc(i.contact_name)}</div><div class='meta'>WhatsApp · ${esc(i.intent)}</div><div class='body'>${esc(i.body)}</div><div class='suggest'><b>MyPA suggests</b><div class='body'>${esc(i.draft_reply)}</div></div><div class='actions'><button class='btn primary' onclick='approve(${i.id})'>Approve MyPA</button><button class='btn secondary' onclick='rejectA(${i.id})'>I’ll handle it</button></div></div></div></div>`).join(''):`<div class='card'><div class='body'>You’re clear for now.</div></div>`;document.getElementById('activity').innerHTML=d.activity.length?d.activity.map(a=>`<div class='card'><div class='title'>${esc(a.title)}</div><div class='body'>${esc(a.detail)}</div><div class='meta'>${new Date(a.created_at).toLocaleString()}</div></div>`).join(''):`<div class='card'><div class='body'>Nothing handled yet.</div></div>`}catch(e){}}async function simulate(){let r=await api('/api/test/incoming',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('testName').value,text:document.getElementById('testText').value})});if(r.ok){toast('Message received by MyPA');load()}}async function approve(id){let r=await api('/api/actions/'+id+'/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});let d=await r.json();if(!r.ok)return toast(d.error||'Could not approve');toast(d.sent?'Reply sent':'Approved in test mode');load()}async function rejectA(id){await api('/api/actions/'+id+'/reject',{method:'POST'});toast('Left for you');load()}function ask(){let v=document.getElementById('ask').value.trim();if(!v)return;toast('MyPA heard you: '+v);document.getElementById('ask').value=''}setInterval(()=>{if(!document.getElementById('main').classList.contains('hidden'))load()},7000)</script></body></html>
